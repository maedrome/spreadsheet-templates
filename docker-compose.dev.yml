# PostgreSQL only, for `ng serve` + `dotnet run` development.
name: spreadsheets-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spreadsheets
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev:
