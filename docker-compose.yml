services:
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-spreadsheets};Username=${POSTGRES_USER:-app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};GSS Encryption Mode=Disable
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Site__BaseUrl: ${SITE_BASE_URL:-http://localhost}
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spreadsheets}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  files:
